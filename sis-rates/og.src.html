<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#f6f5f2;font-family:"Plus Jakarta Sans",sans-serif;color:#0b0b0b;display:flex;flex-direction:column;justify-content:center;padding:0 80px;box-sizing:border-box}
h1{font-size:72px;line-height:1.08;letter-spacing:-.03em;margin:0 0 28px;font-weight:800;max-width:980px}
p{font-size:30px;color:#52514e;margin:0 0 48px;font-weight:600}
.bar{position:relative;height:40px;width:820px}
.track{position:absolute;left:0;right:0;top:18px;height:4px;background:#dddcd5;border-radius:2px}
.band{position:absolute;left:260px;width:330px;top:8px;height:24px;background:#2a78d6;border-radius:6px}
.med{position:absolute;left:420px;top:0;width:4px;height:40px;background:#0b0b0b;border-radius:2px}
.you{position:absolute;left:150px;top:6px;width:28px;height:28px;border-radius:50%;background:#eb6834;box-shadow:0 0 0 4px #f6f5f2}
.brand{position:absolute;right:80px;bottom:56px;font-size:26px;font-weight:800}.brand span{color:#7a7973;font-weight:600}
</style></head><body>
<h1>What are Malaysian photographers really charging?</h1>
<p>Add your rate anonymously. See where you stand.</p>
<div class="bar"><div class="track"></div><div class="band"></div><div class="med"></div><div class="you"></div></div>
<div class="brand">MY Photo Rates <span>by SIS</span></div>
</body></html>
