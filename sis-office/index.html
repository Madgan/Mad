<title>SIS 虚拟办公室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: full-bleed pixel office on canvas; HUD floats at the corners; every SIS function opens as a sheet that slides up */
:root{
  --ink:#1b2130; --ink-2:#556073; --paper:#f2f4f6; --card:#ffffff; --line:#d6dce3;
  --jade:#2f7d6d; --jade-2:#e2f0ec; --gold:#e3a63b; --gold-2:#fbefd6; --rose:#d65f4c; --rose-2:#fbe4df;
  --night:#141a26; --glass:rgba(20,26,38,.84);
  --f-display:"Silkscreen", "Noto Sans SC", ui-monospace, monospace;
  --f-body:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* HUD */
.hud{position:fixed;z-index:5}
#hud-me{top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;background:var(--glass);color:#fff;padding:7px 12px 7px 7px;border-radius:12px;border:0;cursor:pointer;text-align:left}
#me-pt{width:42px;height:42px;border-radius:8px;background:#2b3448;image-rendering:pixelated}
.me-name{font-weight:700;font-size:14px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-sub{display:flex;gap:6px;align-items:baseline;font-size:11px;color:rgba(255,255,255,.72)}
.lv{font-family:var(--f-display);color:var(--gold);font-size:11px}
.xp{width:104px;height:5px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;margin-top:5px}
.xp i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
#hud-menu{top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px}
.hbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px;padding:8px 6px 6px;background:var(--glass);color:#fff;border:0;border-radius:10px;font-size:11px;font-weight:500;cursor:pointer}
.hbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hbtn:hover{background:rgba(35,44,62,.92)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:var(--rose);color:#fff;font:700 10px/18px var(--f-display);text-align:center}
#area{top:calc(env(safe-area-inset-top,0px) + 74px);left:50%;transform:translateX(-50%);background:var(--glass);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap;pointer-events:none;animation:tin .3s ease-out}
#area b{font-weight:700;margin-right:6px}
#area span{color:rgba(255,255,255,.7);font-size:12px}
#act{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;box-shadow:3px 3px 0 var(--ink);max-width:62vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#act kbd{font:700 11px var(--f-display);background:var(--ink);color:var(--gold);border-radius:4px;padding:1px 5px;margin-right:6px}
#act:active{transform:translate(3px,3px);box-shadow:none}
#hint{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);color:rgba(255,255,255,.72);font-size:12px;background:var(--glass);padding:6px 10px;border-radius:8px}
@media (max-width:640px){
  #hud-menu{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:auto;left:max(12px,env(safe-area-inset-left,0px))}
  #act{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
  #act kbd{display:none}
  #hint{display:none}
}
@media (pointer:coarse){#hint{display:none}#act kbd{display:none}}

/* Toasts */
#toasts{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 112px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:3px 3px 0 rgba(0,0,0,.3);animation:tin .25s ease-out;text-align:center}
.toast.gold{background:var(--gold);color:var(--ink);font-weight:700}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}

/* Dialogue */
#dialog{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(640px,calc(100% - 24px));box-sizing:border-box;background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 rgba(0,0,0,.45);padding:14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
#dialog.noface{grid-template-columns:minmax(0,1fr)}
#dialog.noface #dlg-cv{display:none}
#dlg-cv{width:64px;height:64px;border-radius:8px;background:#dfe6ec;border:2px solid var(--ink);box-sizing:border-box;image-rendering:pixelated}
.dlg-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#dlg-name{font-weight:700;font-size:15px}
#dlg-title{font-size:12px;color:var(--jade);font-weight:500}
#dlg-text{margin:6px 0 12px;line-height:1.65;font-size:14px;min-height:2.6em}
#dlg-opts{display:flex;flex-wrap:wrap;gap:8px}

/* Buttons & chips */
.btn{appearance:none;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);min-height:36px}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.primary{background:var(--jade);color:#fff}
.btn.gold{background:var(--gold)}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn.sm{font-size:12px;padding:5px 10px;min-height:32px}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none;transform:none}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;min-height:34px}
.chip.sm{padding:3px 10px;font-size:12px;min-height:28px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.chip.locked{color:var(--ink-2);border-style:dashed}
.chip small{font:700 10px var(--f-display);color:var(--gold);margin-left:4px}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid rgba(0,0,0,.14);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.group{display:flex;flex-wrap:wrap;gap:8px}

/* Sheets */
#sheet-wrap{position:fixed;inset:0;z-index:30;background:rgba(10,14,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:min(760px,100%);max-height:88%;display:flex;flex-direction:column;border:3px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);animation:sup .25s ease-out}
@keyframes sup{from{transform:translateY(24px);opacity:.4}}
@media (min-width:760px){#sheet-wrap{align-items:center}.sheet{border-bottom:3px solid var(--ink);border-radius:12px;box-shadow:6px 6px 0 rgba(0,0,0,.4);max-height:86%}}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 12px;border-bottom:2px solid var(--line)}
.sh-t{flex:1;min-width:0}
.sheet-head h2{margin:0;font-size:18px;text-wrap:balance}
.sheet-head p{margin:3px 0 0;font-size:12px;color:var(--ink-2)}
.x{appearance:none;border:2px solid var(--ink);background:var(--card);border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer;flex:none}
.sheet-body{min-height:0;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sheet-foot{padding:12px 16px;border-top:2px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.note{font-size:12px;color:var(--ink-2);margin:0}
.sample{display:inline-block;font:700 10px var(--f-display);letter-spacing:.06em;background:var(--gold-2);color:#8a5a08;padding:2px 6px;border-radius:4px;vertical-align:middle}
h3{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;margin:0 0 8px}
.lede{margin:0;font-size:14px}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.delta{font:700 11px var(--f-display);color:var(--jade)}
.delta.down{color:var(--rose)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--jade)} .chart .bar.now{fill:var(--gold)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink-2);font-size:10px;font-family:var(--f-body)}
.chart .val{fill:var(--ink);font-size:10px;font-weight:700;font-family:var(--f-body)}
.rank{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(70px,38%) 64px;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{font:700 11px var(--f-display);color:var(--ink-2)}
.rank .who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .who small{color:var(--ink-2);margin-left:4px}
.rank .bar{height:8px;border-radius:4px;background:var(--jade-2);overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--jade)}
.rank .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.rank.top .n{color:var(--gold)}

/* Board */
.composer{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:3px 3px 0 rgba(27,33,48,.15)}
textarea,input[type=text],input[type=number]{font:inherit;font-size:14px;border:2px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box;resize:vertical}
textarea:focus,input:focus{border-color:var(--jade);outline:none}
.row-end{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.posts{display:flex;flex-direction:column;gap:10px}
.post{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px}
.pt{width:40px;height:40px;border-radius:8px;background:#dfe6ec;image-rendering:pixelated}
.pt.lg{width:64px;height:64px}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--ink-2)}
.meta b{color:var(--ink);font-size:13px}
.post p{margin:6px 0 8px;line-height:1.65;font-size:14px;overflow-wrap:anywhere}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--jade-2);color:var(--jade);font-weight:700}
.tag.deal{background:var(--gold-2);color:#8a5a08}
.tag.help{background:var(--rose-2);color:#a63e2e}
.post-actions{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ink-2)}
.lk{appearance:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.lk.on{border-color:var(--rose);color:var(--rose);font-weight:700}
.cmts{list-style:none;margin:8px 0 0;padding:8px 10px;background:var(--paper);border-radius:8px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.55}
.cmt-form{display:flex;gap:6px;margin-top:8px}
.cmt-form input{padding:6px 10px;font-size:13px}
.empty{text-align:center;color:var(--ink-2);font-size:13px;padding:20px 0;margin:0}

/* Lists (leads, content, tasks) */
.list{display:flex;flex-direction:column;gap:8px}
.rc{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.rc.done{opacity:.6}
.rc-main{flex:1;min-width:0}
.rc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rc-top b{font-size:14px}
.rc-sub{font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.rc-meta{font-size:12px;color:var(--ink-2);margin-top:2px}
.stage{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.stage.hot{background:var(--rose-2);color:#a63e2e;border-color:transparent}
.stage.warm{background:var(--gold-2);color:#8a5a08;border-color:transparent}
.stage.ok{background:var(--jade-2);color:var(--jade);border-color:transparent}
.rc-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.step{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
.step b{display:block;font:700 18px var(--f-display)}
.step span{font-size:11px;color:var(--ink-2)}
.step.hot{border-color:var(--rose)}
.step.hot b{color:var(--rose)}
.thumb{width:36px;height:64px;border-radius:6px;flex:none;background:linear-gradient(160deg,#3b5bab,#2f7d6d 60%,#e3a63b);position:relative}
.thumb::after{content:"";position:absolute;left:13px;top:25px;border-left:11px solid rgba(255,255,255,.9);border-top:7px solid transparent;border-bottom:7px solid transparent}
.prog{height:6px;border-radius:3px;background:var(--paper);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--jade)}
.xpchip{font:700 11px var(--f-display);color:#8a5a08;background:var(--gold-2);border-radius:6px;padding:4px 8px;white-space:nowrap}
.check{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:#fff}
.check.on{background:var(--jade);border-color:var(--jade)}
.lvcard{display:flex;gap:14px;align-items:center;background:var(--ink);color:#fff;border-radius:10px;padding:12px}
.lvcard .pt{background:#2b3448}
.lv-big{font:700 22px var(--f-display);color:var(--gold)}
.lvcard .note{color:rgba(255,255,255,.72)}
.lvcard .xp{width:100%;max-width:240px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.stats b{display:block;font:700 18px var(--f-display)}
.stats span{font-size:11px;color:var(--ink-2)}
.form{display:grid;gap:10px}
.form label{font-size:12px;font-weight:700;color:var(--ink-2);display:grid;gap:4px}

/* Character editor */
.ed{display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px;align-items:start}
.ed-prev{position:sticky;top:0;display:flex;flex-direction:column;align-items:center;gap:10px;background:linear-gradient(#2b3448,#1e2533);border-radius:12px;padding:14px 10px;color:#fff}
#ed-prev{width:128px;height:190px;image-rendering:pixelated}
.ed-rot{display:flex;align-items:center;gap:10px;font-size:12px}
.ed-rot button{appearance:none;border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:8px;width:34px;height:30px;cursor:pointer}
.ed-opts{display:flex;flex-direction:column;gap:16px;min-width:0}
.ed-opts input[type=text]{max-width:280px}
@media (max-width:600px){
  .ed{grid-template-columns:minmax(0,1fr)}
  .ed-prev{position:static;flex-direction:row;justify-content:center;padding:10px}
  #ed-prev{width:88px;height:130px}
  .ed-prev .side{display:flex;flex-direction:column;gap:8px;align-items:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="game" aria-label="SIS 虚拟办公室地图，点击地面移动"></canvas>

<button id="hud-me" class="hud" type="button" aria-label="我的工位">
  <canvas id="me-pt"></canvas>
  <div>
    <div class="me-name" id="me-name">新同事</div>
    <div class="me-sub"><span class="lv" id="me-lv">LV 1</span><span id="me-role"></span></div>
    <div class="xp"><i id="me-xp"></i></div>
  </div>
</button>

<nav id="hud-menu" class="hud" aria-label="快捷入口">
  <button class="hbtn" type="button" data-hud="tasks"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg><span>任务</span><b class="badge" id="b-tasks" hidden></b></button>
  <button class="hbtn" type="button" data-hud="board"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-6 4z"/></svg><span>同行圈</span><b class="badge" id="b-board" hidden></b></button>
  <button class="hbtn" type="button" data-hud="dash"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 20v-7M11 20V6M16 20v-10M21 20V9"/></svg><span>数据</span></button>
  <button class="hbtn" type="button" data-hud="wardrobe"><svg viewBox="0 0 24 24"><path d="M8 3l4 2 4-2 5 4-3 3-2-1v12H8V9l-2 1-3-3z"/></svg><span>造型</span></button>
</nav>

<div id="area" class="hud" hidden></div>
<button id="act" type="button" hidden></button>
<div id="hint" class="hud">WASD / 方向键移动 · E 互动 · 点地面自动走过去</div>
<div id="toasts" aria-live="polite"></div>

<section id="dialog" hidden role="dialog" aria-labelledby="dlg-name">
  <canvas id="dlg-cv"></canvas>
  <div>
    <div class="dlg-head"><span id="dlg-name"></span><span id="dlg-title"></span></div>
    <p id="dlg-text"></p>
    <div id="dlg-opts"></div>
  </div>
</section>

<div id="sheet-wrap" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TILE = 16, MW = 30, MH = 20;

/* ---------------- palettes & options ---------------- */
const SKIN  = ['#f6d5b8','#eabd94','#c98f62','#9b6642','#6a4329'];
const HAIRC = ['#2a2120','#5b3a26','#9c6430','#d9b45e','#b9bdc6','#8c3a3d','#35488c'];
const CLOTH = ['#2f7d6d','#3b5bab','#d65f4c','#e3a63b','#f2f2ee','#2b2f3a','#8a5aa8','#6d8a3a','#c46f95','#7a8796'];
const SHOES = ['#2b2b30','#f0f0ec','#7a4b2a','#b23a3a'];
const EYE = '#2a2230';
const OPT = {
  gender:[['f','女'],['m','男'],['x','不透露']],
  role:[['leader','团队主管'],['agent','房产经纪'],['content','内容编导'],['admin','行政 / 客服'],['other','其他']],
  hair:[['short','短发'],['side','侧分'],['long','长发'],['pony','马尾'],['bun','丸子头'],['buzz','寸头'],['hijab','头巾']],
  top:[['tee','T 恤'],['shirt','衬衫'],['hoodie','卫衣'],['suit','西装',2]],
  bottom:[['pants','长裤'],['shorts','短裤'],['skirt','裙子']],
  hat:[['none','无'],['cap','鸭舌帽'],['beanie','毛线帽'],['helmet','工地安全帽',3]],
  glasses:[['none','无'],['round','眼镜'],['sun','墨镜',2]],
  watch:[['none','无'],['silver','银表'],['gold','金表',3]],
};
const ROLE = Object.fromEntries(OPT.role);

(function paintBase(){

  for (let y=0;y<MH;y++) for (let x=0;x<MW;x++){

        break; }
      case ',': R(X,Y,16,16,'#5f8794'); if ((x+y)%2===0) R(X+7,Y+7,2,2,'#6c96a3'); break;
      case ':': R(X,Y,16,16,'#273248'); R(X,Y,16,1,'#313f59'); R(X,Y,1,16,'#313f59'); break;

      case 'r': R(X,Y,16,16,'#d8dde3'); R(X,Y+15,16,1,'#c4cbd3'); R(X+15,Y,1,16,'#c4cbd3'); break;

      case '#': {
        R(X,Y,16,16,'#394456');
        const below = y+1<MH && G[y+1][x] !== '#';

/* ---------------- avatar renderer ---------------- */
function shade(hex,a){
  const n=parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255; const f=a<0?0:255, t=Math.abs(a);
  r=Math.round(r+(f-r)*t); g=Math.round(g+(f-g)*t); b=Math.round(b+(f-b)*t);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}

  if (dir==='down'){ Q(4,4,1,2,EYE); Q(7,4,1,2,EYE); Q(5,6,2,1,'#b85e4d'); Q(3,6,1,1,'rgba(214,95,76,.3)'); Q(8,6,1,1,'rgba(214,95,76,.3)'); }
  else if (side){ Q(3,4,1,2,EYE); Q(2,6,2,1,'#b85e4d'); }
  // hair
  const H = (x,y,w,h) => Q(x,y,w,h,hair);
  if (dir==='down'){
    switch(hs){
      case 'short': H(2,0,8,2); H(2,2,1,2); H(9,2,1,2); H(3,2,3,1); H(7,2,2,1); break;
      case 'side':  H(2,0,8,2); H(2,2,1,3); H(9,2,1,2); H(3,2,5,1); H(3,3,2,1); break;
      case 'long':  H(2,0,8,2); H(1,1,2,10); H(9,1,2,10); H(3,2,6,1); break;
      case 'pony':  H(2,0,8,2); H(2,2,1,3); H(9,2,1,3); H(3,2,6,1); Q(9,1,2,1,'#d65f4c'); break;
      case 'bun':   H(4,-2,4,2); H(2,0,8,2); H(2,2,1,2); H(9,2,1,2); H(3,2,6,1); break;
      case 'buzz':  H(3,1,6,1); H(2,2,1,1); H(9,2,1,1); break;
      case 'hijab': H(2,0,8,2); H(1,1,2,9); H(9,1,2,9); H(2,7,8,2); H(1,8,10,2); break;
    }
  } else if (dir==='up'){
    switch(hs){
      case 'long':  H(3,0,6,1); H(2,1,8,10); break;
      case 'hijab': H(3,0,6,1); H(2,1,8,9); H(1,8,10,2); break;
      case 'pony':  H(3,0,6,1); H(2,1,8,6); H(5,7,2,5); Q(5,7,2,1,'#d65f4c'); break;
      case 'bun':   H(4,-2,4,2); H(3,0,6,1); H(2,1,8,6); break;
      case 'buzz':  H(3,1,6,1); H(2,2,8,4); break;
      default:      H(3,0,6,1); H(2,1,8,6);
    }
  } else {
    switch(hs){
      case 'hijab': H(3,0,5,1); H(2,1,7,2); H(5,3,4,7); H(2,7,7,3); break;
      case 'buzz':  H(3,1,5,1); H(5,2,4,3); break;

        if (hs==='pony'){ H(8,3,2,6); Q(8,3,1,1,'#d65f4c'); }
        if (hs==='bun') H(5,-2,4,2);
        if (hs==='side') H(2,3,2,1);

  }
  // glasses
  if (L.glasses!=='none' && dir!=='up'){
    if (dir==='down'){
      if (L.glasses==='sun'){ const c='#16161c'; Q(3,4,2,2,c); Q(7,4,2,2,c); Q(5,4,2,1,c); Q(4,4,1,1,'#596070'); Q(8,4,1,1,'#596070'); }
      else { const c='#2b2b33'; Q(3,4,2,2,'#cfe8f6'); Q(7,4,2,2,'#cfe8f6'); Q(5,4,2,1,c); Q(3,3,2,1,c); Q(7,3,2,1,c); Q(4,4,1,2,EYE); Q(7,4,1,2,EYE); }

      else { Q(2,3,3,1,'#2b2b33'); Q(2,4,1,2,'#cfe8f6'); Q(3,4,1,2,EYE); Q(5,4,2,1,'#2b2b33'); }

  // hat
  if (L.hat!=='none'){
    const hd = shade(hc,-.22);

      else { Q(2,-1,7,3,'#f2c230'); Q(1,2,9,1,'#d9a514'); Q(4,-1,2,3,'#ffd95a'); }
    } else if (L.hat==='cap'){
      if (dir==='down'){ Q(2,-1,8,3,hc); Q(2,2,8,1,hd); Q(5,0,2,1,shade(hc,.3)); }
      else if (dir==='up'){ Q(2,-1,8,3,hc); Q(5,1,2,1,shade(hc,.3)); }
      else { Q(2,-1,7,3,hc); Q(0,1,3,1,hd); }
    } else if (L.hat==='beanie'){
      const w = side?7:8; Q(2,-1,w,3,hc); Q(2,1,w,1,hd); Q(side?4:5,-2,2,1,'#f2f2ee');

}

let dpr = 1;
function drawPortrait(cv,look){
  if (!cv || !look) return;
  const css = cv.getBoundingClientRect().width || 40;
  const size = Math.round(css*dpr);
  if (cv.width!==size){ cv.width=size; cv.height=size; }
  const g = cv.getContext('2d'); g.clearRect(0,0,size,size);
  const s = Math.max(1, Math.floor(size/13));
  drawAvatar(g, look, 'down', 0, Math.round((size-12*s)/2), Math.round(3*s+(size-13*s)/2), s);
}
function drawFull(cv,look,dir,frame){
  const r = cv.getBoundingClientRect(); const W=Math.round(r.width*dpr), H=Math.round(r.height*dpr);
  if (!W) return;
  if (cv.width!==W || cv.height!==H){ cv.width=W; cv.height=H; }
  const g = cv.getContext('2d'); g.clearRect(0,0,W,H);
  const s = Math.max(1, Math.floor(Math.min(H/24, W/13)));
  drawAvatar(g, look, dir, frame, Math.round((W-12*s)/2), Math.round(2*s+(H-23*s)/2), s);
}

const TG = {

  board:{name:'同行圈留言板', rect:[12,0,6,2], act:'board'},
  wb:{name:'任务白板', rect:[21,0,4,2], act:'tasks'},

const allTargets = () => [...Object.values(TG), ...charTargets];
function distTo(x,y,tg){
  if (tg.char) return Math.hypot(x-tg.char.x, y-tg.char.y) - 8;
  const [rx,ry,rw,rh] = tg.rect; const X=rx*16, Y=ry*16, W=rw*16, H=rh*16;
  const dx = Math.max(X-x, 0, x-(X+W)), dy = Math.max(Y-y, 0, (y-6)-(Y+H));
  return Math.hypot(dx,dy);
}
const IN_RANGE = 14;
function nearest(){
  let best=null, bd=IN_RANGE;
  for (const t of allTargets()){ const d=distTo(player.x,player.y,t); if (d<bd){ bd=d; best=t; } }
  return best;
}

/* ---------------- pathfinding ---------------- */
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const tileOf = c => [Math.floor(c.x/16), Math.floor((c.y-2)/16)];
function bfs(start, isGoal){
  const prev = new Int16Array(MW*MH).fill(-1); const si = start[1]*MW+start[0];
  prev[si] = si; const q=[start]; let h=0;
  while (h<q.length){
    const [x,y] = q[h++]; const i=y*MW+x;
    if (isGoal(x,y)){ const p=[]; let c=i; while (c!==si){ p.push([c%MW,(c/MW)|0]); c=prev[c]; } return p.reverse(); }
    for (const [dx,dy] of DIRS){
      const nx=x+dx, ny=y+dy; if (nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const ni=ny*MW+nx; if (prev[ni]!==-1 || solid[ny][nx]) continue;
      prev[ni]=i; q.push([nx,ny]);
    }
  }
  return null;
}
function goTo(tg){
  closeDialog();
  if (tg.char && tg.char.peer){ tg.char.path=[]; tg.char.wait=8; }
  if (distTo(player.x,player.y,tg) < IN_RANGE){ openTarget(tg); return; }
  const p = bfs(tileOf(player), (x,y) => distTo(x*16+8, y*16+12, tg) < IN_RANGE);
  if (p){ player.path = p.map(tc); player.pending = tg; }
}
function moveAlong(c,dt,speed){
  const [tx,ty] = c.path[0]; const dx=tx-c.x, dy=ty-c.y, d=Math.hypot(dx,dy), st=speed*dt;
  if (d<=st){ c.x=tx; c.y=ty; c.path.shift(); } else { c.x+=dx/d*st; c.y+=dy/d*st; }
  if (d>0.5) c.dir = Math.abs(dx)>Math.abs(dy) ? (dx<0?'left':'right') : (dy<0?'up':'down');
  c.moving = true;
}
function canStand(x,y){
  return [[x-4,y-3],[x+4,y-3],[x-4,y],[x+4,y]].every(([px,py]) => {
    const tx=Math.floor(px/16), ty=Math.floor(py/16);
    return tx>=0 && ty>=0 && tx<MW && ty<MH && !solid[ty][tx];
  });
}
const walkable = []; for (let y=0;y<MH;y++) for (let x=0;x<MW;x++) if (!solid[y][x] && G[y][x]!=='d') walkable.push([x,y]);

function openTarget(tg){
  const c=tg.char;
  if (c){
    const dx=player.x-c.x, dy=player.y-c.y;
    c.dir = Math.abs(dx)>Math.abs(dy) ? (dx<0?'left':'right') : (dy<0?'up':'down');
    player.dir = Math.abs(dx)>Math.abs(dy) ? (dx<0?'right':'left') : (dy<0?'down':'up');
    talking=c;
  } else if (tg.rect){
    const [rx,ry,rw,rh]=tg.rect; const cx=(rx+rw/2)*16, cy=(ry+rh/2)*16;
    const dx=cx-player.x, dy=cy-player.y;
    player.dir = Math.abs(dx)>Math.abs(dy) ? (dx<0?'left':'right') : (dy<0?'up':'down');
  }
  ACTS[tg.act](tg);
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1, 3); vw=innerWidth; vh=innerHeight;
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);

  tapFx={x:wx, y:wy, t:.5};
  let tg = charTargets.find(t => Math.abs(wx-t.char.x)<8 && wy>t.char.y-24 && wy<t.char.y+3);
  if (!tg) tg = Object.values(TG).find(o => { const [rx,ry,rw,rh]=o.rect; return wx>=rx*16 && wx<(rx+rw)*16 && wy>=ry*16-(o.tall||0) && wy<(ry+rh)*16; });

  const tx=Math.floor(wx/16), ty=Math.floor(wy/16);
  if (tx<0||ty<0||tx>=MW||ty>=MH||solid[ty][tx]) return;

  const sx=34, sy=1, sw=108, sh=21;
  R(sx-2,sy-1,sw+4,sh+3,'#10161f'); R(sx,sy,sw,sh,'#0d2230');
  DASH.week.forEach((v,i) => { const bh=Math.round(v/52*12*(.88+.12*Math.sin(t/500+i))); R(sx+6+i*7, sy+sh-3-bh, 5, bh, i===6?'#e3a63b':'#3fb39b'); });
  g.font='6px Silkscreen, monospace'; g.fillStyle='#e3a63b'; g.fillText('RM 4.82M', sx+58, sy+9); g.fillStyle='#7fd6c2'; g.fillText('+12% MOM', sx+58, sy+17);
  R(sx+52, sy+3, 1, sh-6, '#1f3b4d');
  // community board
  const bx=196, by=2, bw=88, bh=20;
  R(bx-2,by-1,bw+4,bh+3,'#6e4b2e'); R(bx,by,bw,bh,'#c4935f');
  const notes=[...S.posts].sort((a,b) => b.t-a.t).slice(0,12);
  notes.forEach((p,i) => { const nx=bx+4+(i%6)*14, ny=by+3+Math.floor(i/6)*9; R(nx,ny,10,7, p.tag==='成交喜报'?'#f6d27a':p.tag==='求助'?'#f3b2a6':p.a==='me'?'#bfe3d8':'#f4f1e6'); R(nx+4,ny,2,1,'#d65f4c'); });
  // task whiteboard
  const wx=338, wy=2;
  R(wx-1,wy-1,62,21,'#9aa5b1'); R(wx,wy,60,19,'#f4f6f8');
  TASKS.forEach((tk,i) => { const y=wy+3+i*4; R(wx+4,y,3,3,S.daily.claimed[tk.id]?'#2f7d6d':'#c4cbd3'); R(wx+10,y+1,30+(i*7)%16,1,'#8a94a3'); });
  R(wx+48,wy+3,8,8,'#d65f4c');
}
function drawFur(g,f,t){
  const X=f.x*16, Y=f.y*16, W=f.w*16, H=f.h*16;
  const R=(x,y,w,h,c) => { g.fillStyle=c; g.fillRect(X+x,Y+y,w,h); };
  switch(f.k){
    case 'desks':
      R(0,1,W,H-4,'#e7e2d8'); R(0,H-3,W,3,'#a99f90'); R(0,H/2-1,W,1,'#cfc7b9');
      for (let i=0;i<f.w;i++){
        R(i*16+3,0,10,6,'#2b313d'); R(i*16+7,6,2,2,'#2b313d');
        R(i*16+3,H/2+1,10,7,'#232a36'); R(i*16+4,H/2+2,8,5,(f.mine&&i===f.w-1)?'#e3a63b':'#4c9bb8');
        R(i*16+4,H-6,8,2,'#c9cdd3');
      }
      if (f.mine){ R(W-15,H-3,13,3,'#e3a63b'); R(2,4,6,4,'#f2f2ee'); }
      break;
    case 'console':
      R(0,4,W,10,'#1e2738'); R(0,4,W,3,'#2d3a52');
      for (let i=0;i<f.w*2;i++) R(4+i*8,9,3,2,((t/400|0)+i)%3?'#3fb39b':'#e3a63b');
      R(0,14,W,2,'#151b27'); break;
    case 'server':
      R(2,-10,12,25,'#1b2230'); R(2,-10,12,2,'#2a3447');
      for (let j=0;j<5;j++){ R(4,-6+j*4,8,2,'#2a3447'); R(10,-6+j*4,1,1,((t/300|0)+j*7+f.y*3)%4?'#3fb39b':'#d65f4c'); }
      break;
    case 'plant': R(4,9,8,6,'#a85e38'); R(4,9,8,2,'#c06d42'); R(2,0,12,10,'#3c8650'); R(4,-3,8,4,'#3c8650'); R(5,1,3,3,'#5aa866'); R(9,-2,2,3,'#5aa866'); break;
    case 'sofa': R(0,2,W,10,'#4c6290'); R(0,10,W,5,'#3a4d74'); R(0,2,3,12,'#3a4d74'); R(W-3,2,3,12,'#3a4d74'); for (let i=1;i<f.w;i++) R(i*16,3,1,7,'#3f5480'); break;
    case 'ctable': R(2,4,W-4,8,'#7a4f33'); R(2,4,W-4,6,'#9a6845'); R(8,5,4,3,'#f2f2ee'); R(18,6,3,2,'#d65f4c'); break;
    case 'mtable':
      R(1,2,W-2,H-4,'#6f4c31'); R(1,2,W-2,H-7,'#8d6342');
      [[10,6],[40,10],[74,5],[92,12]].forEach(([x,y]) => { R(x,y,9,6,'#2b313d'); R(x+1,y+1,7,4,'#7fb6cc'); });
      break;
    case 'chair': R(4,4,8,9,'#2f3a4c'); R(4,3,8,3,'#3f4b60'); break;
    case 'counter':
      R(0,0,W,9,'#c8d0d9'); R(0,9,W,7,'#78869a'); R(0,9,W,1,'#5f6c80');
      R(18,-8,12,15,'#2b2f3a'); R(20,-6,8,4,'#3d4351'); R(22,-1,4,4,'#151820'); R(27,-6,2,2,'#d65f4c');
      R(40,3,6,4,'#f2f2ee'); R(48,2,6,5,'#e3a63b');
      if ((t/700|0)%2){ R(23,-12,1,2,'rgba(255,255,255,.7)'); R(25,-14,1,2,'rgba(255,255,255,.55)'); }
      break;
    case 'fridge': R(1,-12,14,27,'#dde3ea'); R(1,-12,14,1,'#f4f6f8'); R(1,-2,14,1,'#b9c2cd'); R(11,-9,2,5,'#9aa5b1'); R(11,1,2,6,'#9aa5b1'); break;
    case 'rtable':
      g.fillStyle='#c7c0b2'; g.beginPath(); g.arc(X+16,Y+17,12,0,7); g.fill();
      g.fillStyle='#f2efe8'; g.beginPath(); g.arc(X+16,Y+15,11,0,7); g.fill();
      R(10,11,4,4,'#ffffff'); R(19,15,4,4,'#e3a63b'); break;
    case 'fdesk':
      R(0,0,W,6,'#ece7de'); R(0,6,W,10,'#2f7d6d'); R(0,6,W,1,'#256558');
      g.fillStyle='#f3d27a'; g.font='bold 7px Silkscreen, monospace'; g.textAlign='center'; g.fillText('SIS', X+W/2, Y+14); g.textAlign='left';
      R(10,-6,12,8,'#232a36'); R(11,-5,10,5,'#4c9bb8'); R(W-20,1,8,4,'#f2f2ee'); break;
    case 'rack': {
      R(0,-10,2,25,'#6b7280'); R(W-2,-10,2,25,'#6b7280'); R(0,-10,W,2,'#8a919c');
      const cs=[0,1,2,3,6,8,4,5,7,9];
      for (let i=0;i<Math.floor((W-6)/5);i++) R(3+i*5,-8,4,13+(i%2)*2,CLOTH[cs[(i+f.y)%cs.length]]);
      R(0,13,W,2,'#4b5260'); break; }
    case 'mirror': R(1,-14,14,29,'#c9a24a'); R(3,-12,10,25,'#bcd7e6'); R(5,-10,2,8,'#e6f2f8'); R(8,-6,2,4,'#e6f2f8'); break;
    case 'bell': {
      const sh = ring>0 ? Math.round(Math.sin(t/40)*2) : 0;
      R(3,9,10,6,'#6b4a2a'); R(7,0,2,10,'#6b4a2a');
      R(3+sh,-8,10,8,'#e3a63b'); R(2+sh,-1,12,2,'#c88a1f'); R(5+sh,-7,3,3,'#f6cf7c'); R(7+sh,1,2,2,'#c88a1f');
      break; }
    case 'cooler': R(3,2,10,13,'#e9edf1'); R(4,-8,8,10,'#9fd0ea'); R(5,-7,2,6,'#c8e7f5'); R(6,6,4,2,'#3b5bab'); break;
  }
}
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function badgeCount(c){
  if (c.id==='leo') return dueLeads().length;
  if (c.id==='mia') return pendingReview().length;
  if (c.id==='kai') return TASKS.filter(t => !S.daily.claimed[t.id]).length;
  if (c.id==='lisa') return S.daily.checkin ? 0 : '!';
  return 0;
}
function drawLabel(sx,sy,c){
  const name = c.id==='me' ? (S.name||'我') : c.name;
  const tag = c.npc ? 'SIS' : c.peer ? 'LV'+c.lvl : 'LV'+level();
  ctx.font='600 11px "Noto Sans SC", system-ui, sans-serif'; const nw=ctx.measureText(name).width;
  ctx.font='700 9px Silkscreen, monospace'; const tw=ctx.measureText(tag).width;
  const W=nw+tw+20, H=18, x=Math.round(sx-W/2), y=Math.round(sy-H);
  ctx.fillStyle = c.id==='me' ? 'rgba(47,125,109,.92)' : 'rgba(20,26,38,.8)'; rr(ctx,x,y,W,H,5); ctx.fill();
  ctx.fillStyle = c.npc ? '#7fd6c2' : '#e3a63b'; ctx.fillText(tag, x+7, y+12.5);
  ctx.font='600 11px "Noto Sans SC", system-ui, sans-serif'; ctx.fillStyle='#fff'; ctx.fillText(name, x+13+tw, y+13);
  const b = c.npc ? badgeCount(c) : 0;
  if (b){ ctx.fillStyle='#d65f4c'; ctx.beginPath(); ctx.arc(x+W+2, y+2, 8, 0, 7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='700 10px Silkscreen, monospace'; ctx.textAlign='center'; ctx.fillText(String(b), x+W+2, y+5.5); ctx.textAlign='left'; }
  return y;
}
function drawBubble(sx,sy,text){
  ctx.font='500 12px "Noto Sans SC", system-ui, sans-serif';
  const w=Math.min(ctx.measureText(text).width, 200)+16, h=24, x=Math.round(sx-w/2), y=Math.round(sy-h-8);
  ctx.fillStyle='#fff'; ctx.strokeStyle='#1b2130'; ctx.lineWidth=2; rr(ctx,x,y,w,h,7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx-5,y+h-1); ctx.lineTo(sx,y+h+6); ctx.lineTo(sx+5,y+h-1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(sx-5,y+h); ctx.lineTo(sx,y+h+6); ctx.lineTo(sx+5,y+h); ctx.stroke();
  ctx.fillStyle='#1b2130'; ctx.fillText(text, x+8, y+16, 200);
}

/* ---------------- loop ---------------- */
let last=performance.now(), chatter=8, scripted=false, elapsed=0;
function update(dt,now){
  elapsed+=dt;
  if (!uiOpen()){
    let vx=0, vy=0;
    if (keys.has('arrowleft')||keys.has('a')) vx--; if (keys.has('arrowright')||keys.has('d')) vx++;
    if (keys.has('arrowup')||keys.has('w')) vy--; if (keys.has('arrowdown')||keys.has('s')) vy++;
    if (vx||vy){
      const l=Math.hypot(vx,vy), st=78*dt; vx/=l; vy/=l;
      const nx=player.x+vx*st; if (canStand(nx,player.y)) player.x=nx;
      const ny=player.y+vy*st; if (canStand(player.x,ny)) player.y=ny;
      player.dir = Math.abs(vx)>Math.abs(vy) ? (vx<0?'left':'right') : (vy<0?'up':'down');
      player.moving=true;
    } else if (player.path.length){
      moveAlong(player,dt,84);
      if (!player.path.length && player.pending){ const tg=player.pending; player.pending=null; player.moving=false; openTarget(tg); }
    } else player.moving=false;
  } else player.moving=false;

  for (const p of peers){
    if (talking===p){ p.moving=false; continue; }
    if (p.path.length) moveAlong(p,dt,36);
    else { p.moving=false; p.wait-=dt; if (p.wait<=0){ const g=walkable[Math.floor(Math.random()*walkable.length)]; const path=bfs(tileOf(p),(x,y) => x===g[0]&&y===g[1]); p.path=(path||[]).slice(0,18).map(tc); p.wait=3+Math.random()*7; } }
  }
  for (const c of [player,...peers]){ if (c.moving){ c.anim+=dt; c.frame=[1,0,3,0][Math.floor(c.anim*8)%4]; } else { c.frame=0; c.anim=0; } }

  chatter-=dt;
  if (chatter<=0){ const p=peers[Math.floor(Math.random()*peers.length)]; if (!p.bubble) bubble(p,p.lines[Math.floor(Math.random()*p.lines.length)],3.5); chatter=9+Math.random()*8; }
  if (!scripted && elapsed>40 && S.look){
    scripted=true; const p=PM.p3;
    S.posts.push({id:Date.now(), a:'p3', tag:'房源', text:'Setia Alam 一间双层排屋业主降价 RM 30K，这周可以看房，有客户的找我。', t:Date.now(), likes:[], cmts:[]}); save();
    bubble(p,'在同行圈发了新帖',4); updateHUD();
  }
  if (ring>0) ring-=dt;
  confetti = confetti.filter(c => (c.life-=dt)>0); confetti.forEach(c => { c.vy+=160*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; });
  if (tapFx && (tapFx.t-=dt)<=0) tapFx=null;

  const [tx,ty]=tileOf(player); const r=roomAt(tx,ty);
  if (r!==lastRoom){ if (lastRoom && S.look) showArea(r); lastRoom=r; }

  // camera
  const viewW=vw/sc, viewH=vh/sc, mapW=MW*16, mapH=MH*16;
  let cx=player.x-viewW/2, cy=player.y-12-viewH/2;
  cx = viewW>=mapW ? (mapW-viewW)/2 : Math.max(0, Math.min(mapW-viewW, cx));
  cy = viewH>=mapH ? (mapH-viewH)/2 : Math.max(0, Math.min(mapH-viewH, cy));
  if (!camInit){ camX=cx; camY=cy; camInit=true; } else { const k=Math.min(1,dt*7); camX+=(cx-camX)*k; camY+=(cy-camY)*k; }
}
function render(t){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle='#141a26'; ctx.fillRect(0,0,vw,vh);
  const k=sc*dpr; const cx=Math.round(camX*k)/k, cy=Math.round(camY*k)/k;
  ctx.setTransform(k,0,0,k,-cx*k,-cy*k); ctx.imageSmoothingEnabled=false;
  ctx.drawImage(base,0,0);
  drawDecor(ctx,t);
  if (tapFx){ ctx.strokeStyle=`rgba(227,166,59,${tapFx.t*2})`; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(tapFx.x,tapFx.y,7-tapFx.t*8,3.5-tapFx.t*4,0,0,7); ctx.stroke(); }
  const chars=[player,...npcs,...peers];
  const ents=[...F.map(f => ({y:(f.y+f.h)*16-1, f})), ...chars.map(c => ({y:c.y, c}))].sort((a,b) => a.y-b.y);
  for (const e of ents){
    if (e.f) drawFur(ctx,e.f,t);
    else drawAvatar(ctx, e.c.look, e.c.dir, e.c.frame, Math.round(e.c.x-6), Math.round(e.c.y-20), 1);
  }
  confetti.forEach(c => { ctx.fillStyle=c.c; ctx.fillRect(c.x,c.y,2,2); });
  const near = uiOpen() ? null : nearest();
  if (near){
    let ax, ay;
    if (near.char){ ax=near.char.x; ay=near.char.y-44; } else { const [rx,ry,rw]=near.rect; ax=(rx+rw/2)*16; ay=Math.max(6, ry*16-(near.tall||0)-6); }
    const bob=Math.sin(t/180)*1.5;
    ctx.fillStyle='#e3a63b'; ctx.beginPath(); ctx.moveTo(ax-4,ay-5+bob); ctx.lineTo(ax+4,ay-5+bob); ctx.lineTo(ax,ay+bob); ctx.fill();
  }
  // labels in screen space
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const now=performance.now();
  for (const c of chars){
    const sx=(c.x-cx)*sc, sy=(c.y-23-cy)*sc;
    if (sx<-80||sx>vw+80||sy<-40||sy>vh+80) continue;
    const top=drawLabel(sx,sy-2,c);
    if (c.bubble){ if (c.bubble.until<now) c.bubble=null; else drawBubble(sx,top,c.bubble.text); }
  }
  // action button
  const act=$('#act');
  if (near){ const label=`<kbd>E</kbd>${near.char ? '和 '+esc(near.name)+' 说话' : esc(near.name)}`; if (act.dataset.l!==label){ act.innerHTML=label; act.dataset.l=label; } act.hidden=false; }
  else if (!act.hidden) act.hidden=true;
  // editor preview
  const ep=document.getElementById('ed-prev');
  if (ep && ed) drawFull(ep, ed.look, ed.dir, [0,1,0,3][Math.floor(t/220)%4]);
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt,now); render(now);
  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
resize();
lastRoom = roomAt(...tileOf(player));
if (!S.look) openEditor(true);
else setTimeout(() => { showArea(lastRoom); toast(`欢迎回来，${S.name}`); }, 300);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateHUD);
requestAnimationFrame(loop);
})();
</script>
