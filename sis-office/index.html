<title>SIS 虚拟办公室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: illustrated office fills the screen; HUD cards float at the corners; each SIS function opens as a sheet */
:root{
  --ink:#1c2333; --ink-2:#5b6577; --paper:#f4f6f8; --card:#ffffff; --line:#e2e7ed;
  --jade:#2f7d6d; --jade-2:#e3f1ed; --gold:#d99a2b; --gold-2:#fbf0d9; --rose:#d65f4c; --rose-2:#fbe6e1;
  --night:#252c3b; --glass:rgba(255,255,255,.92);
  --f-num:"Manrope", "Noto Sans SC", system-ui, sans-serif;
  --f-body:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --shadow:0 8px 28px rgba(18,24,38,.18);
  color-scheme: light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* HUD */
.hud{position:fixed;z-index:5}
#hud-me{top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;background:var(--glass);color:var(--ink);padding:7px 14px 7px 7px;border-radius:16px;border:0;cursor:pointer;text-align:left;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
#me-pt{width:42px;height:42px;border-radius:12px;background:linear-gradient(#e7f2ef,#d3e6e0)}
.me-name{font-weight:700;font-size:14px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-sub{display:flex;gap:6px;align-items:baseline;font-size:11px;color:var(--ink-2)}
.lv{font:800 11px var(--f-num);color:var(--gold)}
.xp{width:104px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:5px}
.xp i{display:block;height:100%;width:0;background:var(--gold);border-radius:3px;transition:width .4s}
#hud-menu{top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:4px;background:var(--glass);padding:5px;border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.hbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;padding:7px 6px 5px;background:transparent;color:var(--ink);border:0;border-radius:12px;font-size:11px;font-weight:500;cursor:pointer}
.hbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hbtn:hover{background:var(--paper)}
.badge{position:absolute;top:-3px;right:0;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--rose);color:#fff;font:800 10px/18px var(--f-num);text-align:center;box-shadow:0 0 0 2px #fff}
#area{top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translateX(-50%);background:rgba(28,35,51,.86);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap;pointer-events:none;animation:tin .3s ease-out}
#area b{font-weight:700;margin-right:6px}
#area span{color:rgba(255,255,255,.72);font-size:12px}
#act{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--jade);color:#fff;border:0;border-radius:14px;padding:11px 18px;font-size:15px;font-weight:700;box-shadow:0 8px 20px rgba(47,125,109,.4);max-width:62vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#act kbd{font:800 11px var(--f-num);background:rgba(255,255,255,.22);border-radius:5px;padding:1px 6px;margin-right:8px}
#act:active{transform:translateY(1px)}
#hint{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);color:var(--ink-2);font-size:12px;background:var(--glass);padding:7px 12px;border-radius:10px;box-shadow:var(--shadow)}
#zoom{right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;background:var(--glass);padding:4px;border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
#zoom button{appearance:none;border:0;background:transparent;width:40px;height:40px;border-radius:10px;font:700 20px var(--f-num);color:var(--ink);cursor:pointer}
#zoom #z-fit,#zoom #z-fest{font:700 11px var(--f-body);height:34px}
#zoom #z-fest.on{background:#3a2a55;color:#ffb347}
#zoom button:hover{background:var(--paper)}
#zoom button:disabled{opacity:.3;cursor:default;background:transparent}
@media (max-width:640px){
  #hud-menu{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:auto;left:50%;transform:translateX(-50%)}
  #act{bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
  #act kbd{display:none}
  #hint{display:none}
  #zoom{top:calc(env(safe-area-inset-top,0px) + 14px);transform:none;flex-direction:row}
  #zoom button{width:36px}
  #zoom #z-fit,#zoom #z-fest{height:40px;padding:0 8px;width:auto}
}
@media (pointer:coarse){#hint{display:none}#act kbd{display:none}}

/* Toasts */
#toasts{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 116px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);animation:tin .25s ease-out;text-align:center}
.toast.gold{background:var(--gold);color:#fff;font-weight:700}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}

/* Dialogue */
#dialog{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(640px,calc(100% - 24px));box-sizing:border-box;background:var(--card);border-radius:20px;box-shadow:0 16px 48px rgba(18,24,38,.3);padding:16px;display:grid;grid-template-columns:68px minmax(0,1fr);gap:14px;animation:tin .2s ease-out}
#dialog.noface{grid-template-columns:minmax(0,1fr)}
#dialog.noface #dlg-cv{display:none}
#dlg-cv{width:68px;height:68px;border-radius:16px;background:linear-gradient(#e7f2ef,#d3e6e0)}
.dlg-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#dlg-name{font-weight:700;font-size:16px}
#dlg-title{font-size:12px;color:var(--jade);font-weight:500}
#dlg-text{margin:6px 0 12px;line-height:1.7;font-size:14px;min-height:2.6em}
#dlg-opts{display:flex;flex-wrap:wrap;gap:8px}

/* Buttons & chips */
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:700;padding:8px 14px;border-radius:12px;cursor:pointer;min-height:38px;box-shadow:0 1px 2px rgba(18,24,38,.06)}
.btn:hover{border-color:#c9d1db}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink-2)}
.btn.sm{font-size:12px;padding:5px 11px;min-height:32px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;min-height:34px}
.chip.sm{padding:3px 11px;font-size:12px;min-height:28px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.chip.locked{color:var(--ink-2);border-style:dashed}
.chip small{font:800 10px var(--f-num);color:var(--gold);margin-left:4px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.08);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:3px}
.group{display:flex;flex-wrap:wrap;gap:8px}

/* Sheets */
#sheet-wrap{position:fixed;inset:0;z-index:30;background:rgba(14,18,28,.45);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{background:var(--paper);width:min(760px,100%);max-height:88%;display:flex;flex-direction:column;border-radius:22px 22px 0 0;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:sup .25s ease-out}
@keyframes sup{from{transform:translateY(24px);opacity:.4}}
@media (min-width:760px){#sheet-wrap{align-items:center}.sheet{border-radius:22px;max-height:86%}}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 12px}
.sh-t{flex:1;min-width:0}
.sheet-head h2{margin:0;font-size:19px;text-wrap:balance}
.sheet-head p{margin:3px 0 0;font-size:12px;color:var(--ink-2)}
.x{appearance:none;border:0;background:var(--card);border-radius:12px;width:38px;height:38px;font-size:15px;cursor:pointer;flex:none;box-shadow:0 1px 3px rgba(18,24,38,.1)}
.sheet-body{min-height:0;overflow:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) 20px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--card);border-radius:0 0 22px 22px}
.note{font-size:12px;color:var(--ink-2);margin:0}
.sample{display:inline-block;font:800 10px var(--f-num);letter-spacing:.06em;background:var(--gold-2);color:#8a5a08;padding:2px 7px;border-radius:5px;vertical-align:middle}
h3{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;margin:0 0 8px}
.lede{margin:0;font-size:14px}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border-radius:14px;padding:12px 14px;min-width:0;box-shadow:0 1px 3px rgba(18,24,38,.06)}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font:800 22px var(--f-num);font-variant-numeric:tabular-nums;margin:3px 0}
.delta{font:700 11px var(--f-num);color:var(--jade)}
.delta.down{color:var(--rose)}
.panel{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(18,24,38,.06)}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--jade)} .chart .bar.now{fill:var(--gold)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink-2);font-size:10px;font-family:var(--f-body)}
.chart .val{fill:var(--ink);font-size:10px;font-weight:700;font-family:var(--f-num)}
.rank{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(70px,36%) 70px;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{font:800 11px var(--f-num);color:var(--ink-2)}
.rank .who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .who small{color:var(--ink-2);margin-left:4px}
.rank .bar{height:8px;border-radius:4px;background:var(--jade-2);overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--jade);border-radius:4px}
.rank .amt{text-align:right;font:700 13px var(--f-num);font-variant-numeric:tabular-nums}
.rank.top .n{color:var(--gold)}

/* Board */
.composer{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(18,24,38,.08)}
textarea,input[type=text],input[type=number]{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box;resize:vertical}
textarea:focus,input:focus{border-color:var(--jade);outline:none;background:#fff}
.row-end{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.posts{display:flex;flex-direction:column;gap:10px}
.post{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(18,24,38,.06)}
.pt{width:42px;height:42px;border-radius:12px;background:linear-gradient(#e7f2ef,#d3e6e0)}
.pt.lg{width:64px;height:64px;border-radius:16px}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--ink-2)}
.meta b{color:var(--ink);font-size:13px}
.post p{margin:6px 0 8px;line-height:1.7;font-size:14px;overflow-wrap:anywhere}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--jade-2);color:var(--jade);font-weight:700}
.tag.deal{background:var(--gold-2);color:#8a5a08}
.tag.help{background:var(--rose-2);color:#a63e2e}
.post-actions{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ink-2)}
.lk{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:12px;cursor:pointer;color:var(--ink)}
.lk.on{border-color:var(--rose);color:var(--rose);font-weight:700;background:var(--rose-2)}
.cmts{list-style:none;margin:8px 0 0;padding:8px 12px;background:var(--paper);border-radius:10px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.6}
.cmt-form{display:flex;gap:6px;margin-top:8px}
.cmt-form input{padding:6px 10px;font-size:13px}
.empty{text-align:center;color:var(--ink-2);font-size:13px;padding:20px 0;margin:0}

/* Lists */
.list{display:flex;flex-direction:column;gap:8px}
.rc{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(18,24,38,.06)}
.rc.done{opacity:.6}
.rc-main{flex:1;min-width:0}
.rc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rc-top b{font-size:14px}
.rc-sub{font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.rc-meta{font-size:12px;color:var(--ink-2);margin-top:2px}
.stage{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--paper);color:var(--ink-2)}
.stage.hot{background:var(--rose-2);color:#a63e2e}
.stage.warm{background:var(--gold-2);color:#8a5a08}
.stage.ok{background:var(--jade-2);color:var(--jade)}
.rc-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;box-shadow:0 1px 3px rgba(18,24,38,.06)}
.step b{display:block;font:800 20px var(--f-num)}
.step span{font-size:11px;color:var(--ink-2)}
.step.hot b{color:var(--rose)}
.thumb{width:36px;height:64px;border-radius:8px;flex:none;background:linear-gradient(160deg,#3b5bab,#2f7d6d 60%,#d99a2b);position:relative}
.thumb::after{content:"";position:absolute;left:13px;top:25px;border-left:11px solid rgba(255,255,255,.92);border-top:7px solid transparent;border-bottom:7px solid transparent}
.prog{height:6px;border-radius:3px;background:var(--paper);overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;background:var(--jade);border-radius:3px}
.xpchip{font:800 11px var(--f-num);color:#8a5a08;background:var(--gold-2);border-radius:8px;padding:4px 9px;white-space:nowrap}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.check.on{background:var(--jade);border-color:var(--jade)}
.lvcard{display:flex;gap:14px;align-items:center;background:var(--ink);color:#fff;border-radius:16px;padding:14px}
.lv-big{font:800 24px var(--f-num);color:#f2c56b}
.lvcard .note{color:rgba(255,255,255,.72)}
.lvcard .xp{width:100%;max-width:240px;background:rgba(255,255,255,.18)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--card);border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(18,24,38,.06)}
.stats b{display:block;font:800 20px var(--f-num)}
.stats span{font-size:11px;color:var(--ink-2)}
.form{display:grid;gap:12px}
.form label{font-size:12px;font-weight:700;color:var(--ink-2);display:grid;gap:5px}

/* Character editor */
.ed{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:start}
.ed-prev{position:sticky;top:0;display:flex;flex-direction:column;align-items:center;gap:10px;background:radial-gradient(circle at 50% 40%,#f3faf8,#d6e8e3);border-radius:18px;padding:14px 10px}
#ed-prev{width:150px;height:200px}
.ed-rot{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2)}
.ed-rot button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;width:34px;height:30px;cursor:pointer}
.ed-opts{display:flex;flex-direction:column;gap:16px;min-width:0}
.ed-opts input[type=text]{max-width:280px}
@media (max-width:600px){
  .ed{grid-template-columns:minmax(0,1fr)}
  .ed-prev{position:static;flex-direction:row;justify-content:center;padding:10px}
  #ed-prev{width:100px;height:136px}
  .ed-prev .side{display:flex;flex-direction:column;gap:8px;align-items:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="game" aria-label="SIS 虚拟办公室地图。点房间直接打开功能，拖动可移动视角"></canvas>

<button id="hud-me" class="hud" type="button" aria-label="我的工位">
  <canvas id="me-pt"></canvas>
  <div>
    <div class="me-name" id="me-name">新同事</div>
    <div class="me-sub"><span class="lv" id="me-lv">LV 1</span><span id="me-role"></span></div>
    <div class="xp"><i id="me-xp"></i></div>
  </div>
</button>

<nav id="hud-menu" class="hud" aria-label="快捷入口">
  <button class="hbtn" type="button" data-hud="tasks"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg><span>任务</span><b class="badge" id="b-tasks" hidden></b></button>
  <button class="hbtn" type="button" data-hud="board"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-6 4z"/></svg><span>同行圈</span><b class="badge" id="b-board" hidden></b></button>
  <button class="hbtn" type="button" data-hud="dash"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 20v-7M11 20V6M16 20v-10M21 20V9"/></svg><span>数据</span></button>
  <button class="hbtn" type="button" data-hud="wardrobe"><svg viewBox="0 0 24 24"><path d="M8 3l4 2 4-2 5 4-3 3-2-1v12H8V9l-2 1-3-3z"/></svg><span>造型</span></button>
</nav>

<div id="area" class="hud" hidden></div>
<button id="act" type="button" hidden></button>
<div id="hint" class="hud">点任意房间直接打开 · 滚轮缩放 · WASD 走动 · E 互动</div>
<div id="zoom" class="hud" role="group" aria-label="缩放">
  <button type="button" id="z-in" aria-label="放大">+</button>
  <button type="button" id="z-out" aria-label="缩小">−</button>
  <button type="button" id="z-fit" aria-label="查看整个办公室">全景</button>
  <button type="button" id="z-fest" aria-label="节日装饰" aria-pressed="false">节日</button>
</div>
<div id="toasts" aria-live="polite"></div>

<section id="dialog" hidden role="dialog" aria-labelledby="dlg-name">
  <canvas id="dlg-cv"></canvas>
  <div>
    <div class="dlg-head"><span id="dlg-name"></span><span id="dlg-title"></span></div>
    <p id="dlg-text"></p>
    <div id="dlg-opts"></div>
  </div>
</section>

<div id="sheet-wrap" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ---------------- drawing helpers ---------------- */
function rr(g,x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2)); g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function shade(hex,a){
  const n=parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255; const f=a<0?0:255, t=Math.abs(a);
  r=Math.round(r+(f-r)*t); g=Math.round(g+(f-g)*t); b=Math.round(b+(f-b)*t);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
function kit(g,X=0,Y=0){
  return {
    R:(x,y,w,h,c) => { g.fillStyle=c; g.fillRect(X+x,Y+y,w,h); },
    RR:(x,y,w,h,r,c) => { g.fillStyle=c; rr(g,X+x,Y+y,w,h,r); g.fill(); },
    C:(x,y,r,c) => { g.fillStyle=c; g.beginPath(); g.arc(X+x,Y+y,r,0,Math.PI*2); g.fill(); },
    E:(x,y,rx,ry,c) => { g.fillStyle=c; g.beginPath(); g.ellipse(X+x,Y+y,rx,ry,0,0,Math.PI*2); g.fill(); },
    SH:(x,y,w,h,r=8) => { g.fillStyle='rgba(28,35,51,.14)'; rr(g,X+x+2,Y+y+4,w,h,r); g.fill(); },
  };
}

/* ---------------- static floor layer ---------------- */
let base = document.createElement('canvas');
const ACCENT = {data:'#3b5bab', lounge:'#2f7d6d', meet:'#d99a2b', pantry:'#d65f4c', ward:'#c46f95', recep:'#2f7d6d', office:'#c3cad5'};
function paintBase(k){
  base.width = Math.round(WW*k); base.height = Math.round(WH*k);
  const b = base.getContext('2d'); b.setTransform(k,0,0,k,0,0);
  const {R,RR,C} = kit(b);
  for (let y=0;y<MH;y++) for (let x=0;x<MW;x++){
    const X=x*T, Y=y*T, c=G[y][x];
    switch(c){
      case '.': case 'd': {
        R(X,Y,T,T,'#ead4ae');
        for (let p=0;p<4;p++){ R(X,Y+p*8+7.4,T,.6,'#dcc195'); R(X+((p*11+y*7+x*3)%T),Y+p*8,.6,8,'#dcc195'); }
        if (c==='d'){ R(X,Y,3,T,'#9aa3b3'); R(X+T-3,Y,3,T,'#9aa3b3'); R(X+3,Y,T-6,2,'#cdb48c'); }
        break; }
      case ',': R(X,Y,T,T,'#d4e6e1'); if ((x+y)%2===0) C(X+16,Y+16,1.2,'#c3dad4'); break;
      case ':': R(X,Y,T,T,'#2c3754'); R(X,Y,T,.8,'#37446a'); R(X,Y,.8,T,'#37446a'); break;
      case ';': R(X,Y,T,T,'#e6eaf0'); R(X,Y+T-.8,T,.8,'#d8dde5'); R(X+T-.8,Y,.8,T,'#d8dde5'); break;

let dpr = 1;
function drawPortrait(cv,look){
  if (!cv || !look) return;
  const css = cv.getBoundingClientRect().width || 42;
  const size = Math.round(css*dpr);
  if (cv.width!==size){ cv.width=size; cv.height=size; }
  const g = cv.getContext('2d'); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,size,size);
  const s = size/44; g.translate(size/2, 60*s); g.scale(s,s);
  drawChar(g, look, 'down', 0, false);
}
function drawFull(cv,look,dir,ph){
  const r = cv.getBoundingClientRect(); const W=Math.round(r.width*dpr), H=Math.round(r.height*dpr);
  if (!W) return;
  if (cv.width!==W || cv.height!==H){ cv.width=W; cv.height=H; }
  const g = cv.getContext('2d'); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,H);
  const s = Math.min(H/68, W/36); g.translate(W/2, H-5*s); g.scale(s,s);
  drawChar(g, look, dir, ph, true);
}

const allTargets = () => [...Object.values(TG), ...charTargets];
function distTo(x,y,tg){
  if (tg.char) return Math.hypot(x-tg.char.x, y-tg.char.y) - 16;
  const [rx,ry,rw,rh] = tg.rect; const X=rx*T, Y=ry*T, W=rw*T, H=rh*T;
  const dx = Math.max(X-x, 0, x-(X+W)), dy = Math.max(Y-y, 0, (y-12)-(Y+H));
  return Math.hypot(dx,dy);
}
const IN_RANGE = 28;
function nearest(){
  let best=null, bd=IN_RANGE;
  for (const t of allTargets()){ const d=distTo(player.x,player.y,t); if (d<bd){ bd=d; best=t; } }
  return best;
}

/* ---------------- pathfinding ---------------- */
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const tileOf = c => [Math.floor(c.x/T), Math.floor((c.y-4)/T)];
function bfs(start, isGoal){
  const prev = new Int16Array(MW*MH).fill(-1); const si = start[1]*MW+start[0];
  prev[si] = si; const q=[start]; let h=0;
  while (h<q.length){
    const [x,y] = q[h++]; const i=y*MW+x;
    if (isGoal(x,y)){ const p=[]; let c=i; while (c!==si){ p.push([c%MW,(c/MW)|0]); c=prev[c]; } return p.reverse(); }
    for (const [dx,dy] of DIRS){
      const nx=x+dx, ny=y+dy; if (nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const ni=ny*MW+nx; if (prev[ni]!==-1 || solid[ny][nx]) continue;
      prev[ni]=i; q.push([nx,ny]);
    }
  }
  return null;
}
function walkTo(tg){
  const p = bfs(tileOf(player), (x,y) => distTo(x*T+16, y*T+24, tg) < IN_RANGE);
  if (p){ player.path = p.map(tc); player.pending = tg; camFree=false; }
}
function moveAlong(c,dt,speed){
  const [tx,ty] = c.path[0]; const dx=tx-c.x, dy=ty-c.y, d=Math.hypot(dx,dy), st=speed*dt;
  if (d<=st){ c.x=tx; c.y=ty; c.path.shift(); } else { c.x+=dx/d*st; c.y+=dy/d*st; }
  if (d>1) c.dir = Math.abs(dx)>Math.abs(dy) ? (dx<0?'left':'right') : (dy<0?'up':'down');
  c.moving = true;
}
function canStand(x,y){
  return [[x-8,y-6],[x+8,y-6],[x-8,y],[x+8,y]].every(([px,py]) => {
    const tx=Math.floor(px/T), ty=Math.floor(py/T);
    return tx>=0 && ty>=0 && tx<MW && ty<MH && !solid[ty][tx];
  });
}
const walkable = []; for (let y=0;y<MH;y++) for (let x=0;x<MW;x++) if (!solid[y][x] && G[y][x]!=='d') walkable.push([x,y]);

  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 2600);
}
let areaTimer=0, lastRoom='';
function showArea(r){
  const el=$('#area'); el.innerHTML=`<b>${ROOMS[r][0]}</b><span>${ROOMS[r][1]}</span>`;
  el.hidden=false; el.style.animation='none'; void el.offsetWidth; el.style.animation='';
  clearTimeout(areaTimer); areaTimer=setTimeout(() => el.hidden=true, 2200);
}

function updateHUD(){
  $('#me-name').textContent = S.name || '新同事';
  $('#me-role').textContent = ROLE[S.role] || '';
  $('#me-lv').textContent = 'LV '+level();
  $('#me-xp').style.width = (S.xp%100)+'%';
  drawPortrait($('#me-pt'), player.look);

/* ---------------- XP & tasks ---------------- */
function unlocksAt(l){
  const names=[]; for (const k in OPT) OPT[k].forEach(o => { if (o[2]===l) names.push(o[1]); }); return names.join('、');
}
function gainXP(n,why){
  const before=level(); S.xp+=n; save();
  toast(`+${n} XP · ${why}`,'gold');
  const after=level();
  if (after>before){
    const un=unlocksAt(after);
    setTimeout(() => toast(`升级到 LV ${after}${un ? ' · 解锁 '+un : ''}`,'gold'), 700);
    bubble(player,`LV ${after}！`); burst(player.x,player.y-40,30);
  }
  updateHUD();
}
function checkTasks(){
  TASKS.forEach(t => { if (!S.daily.claimed[t.id] && t.get()>=t.goal){ S.daily.claimed[t.id]=true; gainXP(t.xp,'任务完成：'+t.name); } });
  save(); updateHUD();
}

/* ---------------- dialogue ---------------- */
const dlg=$('#dialog'); let typeTimer=0, talking=null;
function say(who,text,opts=[]){
  closeSheet();
  dlg.hidden=false;
  dlg.classList.toggle('noface', !who.look);
  $('#dlg-name').textContent = who.name; $('#dlg-title').textContent = who.title||'';
  if (who.look) requestAnimationFrame(() => drawPortrait($('#dlg-cv'), who.look));
  const tEl=$('#dlg-text'); clearInterval(typeTimer); let i=0; tEl.textContent='';
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) tEl.textContent=text;
  else typeTimer=setInterval(() => { i+=2; tEl.textContent=text.slice(0,i); if (i>=text.length) clearInterval(typeTimer); }, 22);
  tEl.onclick = () => { clearInterval(typeTimer); tEl.textContent=text; };
  const box=$('#dlg-opts'); box.innerHTML='';
  if (!opts.some(o => o.bye)) opts.push({label:'再见', bye:true});
  opts.forEach(o => {
    const b=document.createElement('button'); b.type='button';
    b.className='btn'+(o.primary?' primary':'')+(o.bye?' ghost':''); b.textContent=o.label;
    b.onclick = () => { closeDialog(); o.fn && o.fn(); };
    box.appendChild(b);
  });
  keys.clear();
}
function closeDialog(){
  if (dlg.hidden) return;
  dlg.hidden=true; clearInterval(typeTimer);
  if (talking && talking.npc) talking.dir = talking.face;
  talking=null;
}

const wrap=$('#sheet-wrap'), sheet=$('#sheet'); let sheetLocked=false, sheetKind=null;
function openSheet({title,sub='',body,foot='',locked=false,kind}){
  closeDialog();
  sheetKind=kind; sheetLocked=locked;
  sheet.innerHTML = `<header class="sheet-head"><div class="sh-t"><h2 id="sheet-title">${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${locked?'':'<button class="x" type="button" data-close aria-label="关闭">✕</button>'}</header><div class="sheet-body" id="sheet-body">${body}</div>${foot?`<footer class="sheet-foot">${foot}</footer>`:''}`;
  wrap.hidden=false; keys.clear();

function setBody(html){ const b=$('#sheet-body'); if (!b) return; const st=b.scrollTop; b.innerHTML=html; b.scrollTop=st; paintPortraits(b); }
function closeSheet(){
  if (sheetLocked) return;
  wrap.hidden=true; sheet.innerHTML=''; sheetKind=null; updateHUD();

function paintPortraits(root){ root.querySelectorAll('canvas[data-who]').forEach(cv => drawPortrait(cv, whoLook(cv.dataset.who))); }

const ago = t => { const m=Math.round((Date.now()-t)/60000); return m<1?'刚刚':m<60?`${m} 分钟前`:m<1440?`${Math.round(m/60)} 小时前`:`${Math.round(m/1440)} 天前`; };
const tagCls = t => t==='成交喜报'?'deal':t==='求助'?'help':'';

async function openDash(){
  const D = await SIS.dashboard();
  const d=new Date(); const labels=D.week.map((_,i) => { const x=new Date(d); x.setDate(d.getDate()-(6-i)); return i===6?'今天':'周'+'日一二三四五六'[x.getDay()]; });
  const W=320,Hh=150,pad=24,bw=28,gap=(W-pad-8-bw*7)/6,max=60,plotH=Hh-44;
  const yv = v => Hh-24-(v/max)*plotH;
  const svg = `<svg viewBox="0 0 ${W} ${Hh}" class="chart" role="img" aria-label="近 7 天新线索">`+
    [0,20,40,60].map(v => `<line x1="${pad}" x2="${W-4}" y1="${yv(v)}" y2="${yv(v)}" class="grid"/><text x="${pad-6}" y="${yv(v)+3}" class="ax" text-anchor="end">${v}</text>`).join('')+
    D.week.map((v,i) => { const x=pad+4+i*(bw+gap), y=yv(v); return `<rect x="${x}" y="${y}" width="${bw}" height="${Hh-24-y}" rx="5" class="bar${i===6?' now':''}"/><text x="${x+bw/2}" y="${y-5}" class="val" text-anchor="middle">${v}</text><text x="${x+bw/2}" y="${Hh-8}" class="ax" text-anchor="middle">${labels[i]}</text>`; }).join('')+`</svg>`;
  const maxR = D.rank[0][2];
  const body = `
    <div class="kpis">${D.kpi.map(([l,v,dl]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="delta${dl.startsWith('-')?' down':''}">${dl} 较上月</div></div>`).join('')}</div>
    <div class="panel"><h3>近 7 天新线索（条）</h3>${svg}</div>
    <div class="panel"><h3>团队主管排行 · 本月成交额</h3>
      ${D.rank.map(([n,area,v,c],i) => `<div class="rank${i<3?' top':''}"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="who">${n}<small>${area} · ${c} 条内容</small></span><span class="bar"><i style="width:${(v/maxR*100).toFixed(1)}%"></i></span><span class="amt">RM ${v.toFixed(2)}M</span></div>`).join('')}
    </div>
    <p class="note"><span class="sample">SAMPLE</span> 示例数据。接入 SIS 后自动更新。</p>`;
  openSheet({title:'数据大屏', sub:'团队本月表现', body, kind:'dash'});
  if (!S.daily.dash){ S.daily.dash=true; checkTasks(); }
}

function randomLook(){
  const lv=level(), pick=a => a[Math.floor(Math.random()*a.length)];
  const ok = list => list.filter(o => (!o[2] || o[2]<=lv) && (!o[3] || festOn())).map(o => o[0]);
  const L = {gender:ed.look.gender, skin:Math.floor(Math.random()*SKIN.length), hair:pick(ok(OPT.hair)), top:pick(ok(OPT.top)), bottom:pick(ok(OPT.bottom)),
    topColor:Math.floor(Math.random()*CLOTH.length), bottomColor:Math.floor(Math.random()*CLOTH.length), shoes:Math.floor(Math.random()*SHOES.length),
    hat:Math.random()<.35?pick(ok(OPT.hat)):'none', hatColor:Math.floor(Math.random()*CLOTH.length), glasses:Math.random()<.4?pick(ok(OPT.glasses)):'none', watch:Math.random()<.5?pick(ok(OPT.watch)):'none'};
  L.hairColor = Math.floor(Math.random()*(L.hair==='hijab'?CLOTH.length:HAIRC.length));
  return L;
}

const cv=$('#game'), ctx=cv.getContext('2d');
let vw=0, vh=0, sc=1, camX=0, camY=0, camInit=false, camFree=false, labelHits=[], hover=null;
let zMin=.4, zMax=2.6, zFit=1, zoomed=false, repaintT=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1, 3); vw=innerWidth; vh=innerHeight;
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
  zFit = Math.min(vw/WW, (vh-150)/WH);
  const zDefault = Math.max(zFit, Math.min(vh/WH*.8, vw/(T*9)));
  zMin = Math.min(zFit, 1)*.9; zMax = Math.max(zDefault*2.2, 2);

  paintBase(Math.min(sc*dpr, 4096/WW));
  updateHUD(); updateZoomUI();
}
// Zoom around a screen point so whatever is under the finger or cursor stays put.
function setZoom(next, fx=vw/2, fy=vh/2){
  next = Math.max(zMin, Math.min(zMax, next));
  if (Math.abs(next-sc)<1e-4) return;
  const wx=fx/sc+camX, wy=fy/sc+camY;
  sc=next; camX=wx-fx/sc; camY=wy-fy/sc; camFree=true; zoomed=true; clampCam();
  clearTimeout(repaintT); repaintT=setTimeout(() => paintBase(Math.min(sc*dpr, 4096/WW)), 160);
  updateZoomUI();
}
function updateZoomUI(){ $('#z-in').disabled = sc>=zMax-1e-3; $('#z-out').disabled = sc<=zMin+1e-3; }

addEventListener('resize', resize);
function clampCam(){
  const viewW=vw/sc, viewH=vh/sc;
  camX = viewW>=WW ? (WW-viewW)/2 : Math.max(0, Math.min(WW-viewW, camX));
  camY = viewH>=WH ? (WH-viewH)/2 : Math.max(-60/sc, Math.min(WH-viewH+80/sc, camY));
}
function hitTest(clientX,clientY){
  const r=cv.getBoundingClientRect(); const sx=clientX-r.left, sy=clientY-r.top;
  for (const h of labelHits) if (sx>=h.x && sx<=h.x+h.w && sy>=h.y && sy<=h.y+h.h) return {kind:'label', act:h.act, zone:h.zone};
  const wx=sx/sc+camX, wy=sy/sc+camY;
  if (festOn() && PUMPKINS.some(p => Math.hypot(wx-p.x, wy-(p.y-8))<15)) return {kind:'label', act:'candy'};
  const ch = charTargets.find(t => Math.abs(wx-t.char.x)<14 && wy>t.char.y-60 && wy<t.char.y+4);
  if (ch) return {kind:'char', tg:ch};
  const ob = Object.values(TG).find(o => { const [rx,ry,rw,rh]=o.rect; return wx>=rx*T && wx<(rx+rw)*T && wy>=ry*T-(o.tall||0) && wy<(ry+rh)*T; });
  if (ob) return {kind:'obj', tg:ob};
  const z = ZONES.find(z => { const [rx,ry,rw,rh]=z.r; return wx>=rx*T && wx<(rx+rw)*T && wy>=ry*T && wy<(ry+rh)*T; });

  if (h.kind==='char' || h.kind==='obj'){ openTarget(h.tg); return; }
  const tx=Math.floor(h.wx/T), ty=Math.floor(h.wy/T);
  if (tx<0||ty<0||tx>=MW||ty>=MH||solid[ty][tx]) return;
  const p=bfs(tileOf(player), (x,y) => x===tx && y===ty);
  if (p){ player.path=p.map(tc); player.pending=null; camFree=false; tapFx={x:h.wx,y:h.wy,t:.5}; }
}
let ptr=null, tapFx=null, pinch=null; const pts=new Map();
const two = () => { const [a,b]=[...pts.values()]; return {d:Math.hypot(a.x-b.x,a.y-b.y)||1, x:(a.x+b.x)/2, y:(a.y+b.y)/2}; };
cv.addEventListener('pointerdown', e => {
  if (uiOpen()) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); try { cv.setPointerCapture(e.pointerId); } catch(err) {}
  if (pts.size===1) ptr={id:e.pointerId,x:e.clientX,y:e.clientY,cx:camX,cy:camY,moved:false};
  else if (pts.size===2){ ptr=null; pinch=two(); }
});
cv.addEventListener('pointermove', e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pinch && pts.size>=2){
    const p=two(), r=cv.getBoundingClientRect();
    setZoom(sc*p.d/pinch.d, p.x-r.left, p.y-r.top);
    camX-=(p.x-pinch.x)/sc; camY-=(p.y-pinch.y)/sc; clampCam(); pinch=p; return;
  }
  if (ptr && e.pointerId===ptr.id){
    const dx=e.clientX-ptr.x, dy=e.clientY-ptr.y;
    if (!ptr.moved && Math.hypot(dx,dy)>8) ptr.moved=true;
    if (ptr.moved){ camX=ptr.cx-dx/sc; camY=ptr.cy-dy/sc; camFree=true; clampCam(); }
  } else if (e.pointerType==='mouse' && !uiOpen()){
    hover = hitTest(e.clientX,e.clientY);

  }
});
const lift = e => { pts.delete(e.pointerId); if (pts.size<2) pinch=null; };
cv.addEventListener('pointerup', e => { lift(e); if (!ptr || e.pointerId!==ptr.id) return; const moved=ptr.moved; ptr=null; if (!moved && !uiOpen()) tap(e.clientX,e.clientY); });

cv.addEventListener('wheel', e => {
  if (uiOpen()) return; e.preventDefault();
  const r=cv.getBoundingClientRect();

let last=performance.now(), chatter=8, scripted=false, elapsed=0;
function update(dt){

    if (vx||vy){
      const l=Math.hypot(vx,vy), st=150*dt; vx/=l; vy/=l;
      const nx=player.x+vx*st; if (canStand(nx,player.y)) player.x=nx;
      const ny=player.y+vy*st; if (canStand(player.x,ny)) player.y=ny;
      player.dir = Math.abs(vx)>Math.abs(vy) ? (vx<0?'left':'right') : (vy<0?'up':'down');
      player.moving=true;
    } else if (player.path.length){
      moveAlong(player,dt,165);
      if (!player.path.length && player.pending){ const tg=player.pending; player.pending=null; player.moving=false; openTarget(tg); }
    } else player.moving=false;
  } else player.moving=false;

  for (const p of peers){

    else { p.moving=false; p.wait-=dt; if (p.wait<=0){ const g=walkable[Math.floor(Math.random()*walkable.length)]; const path=bfs(tileOf(p),(x,y) => x===g[0]&&y===g[1]); p.path=(path||[]).slice(0,18).map(tc); p.wait=3+Math.random()*7; } }

  }
  const act=$('#act');
  if (near){ const label=`<kbd>E</kbd>${near.char ? '和 '+esc(near.name)+' 说话' : esc(near.name)}`; if (act.dataset.l!==label){ act.innerHTML=label; act.dataset.l=label; } act.hidden=false; }
  else if (!act.hidden) act.hidden=true;
  const ep=document.getElementById('ed-prev');
  if (ep && ed) drawFull(ep, ed.look, ed.dir, t/130);
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt); render(now);
  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
resize();
lastRoom = roomAt(...tileOf(player));
refresh().then(() => {
  if (!S.look) openEditor(true);
  else setTimeout(() => { showArea(lastRoom); toast(`欢迎回来，${S.name}`); }, 300);
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateHUD);
requestAnimationFrame(loop);
})();
</script>
